name: Test and deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Regenerate cards from preserved real appearances
        run: python scripts/build_data.py
      - name: Test Python simulation, saves, season and data safeguards
        run: python -m unittest discover -s tests -v
      - name: Build static site
        run: python scripts/build_site.py
      - name: Store local preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-archive-preview
          path: dist
      - name: Configure Pages
        if: github.event_name != 'pull_request' && vars.PUBLIC_RELEASE_APPROVED == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && vars.PUBLIC_RELEASE_APPROVED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && vars.PUBLIC_RELEASE_APPROVED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
